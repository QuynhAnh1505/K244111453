<html>
    <head>
        <title> Tiêu đề trang</title>
        <link rel="stylesheet" href="css/maincss.css">
        <script>
            var products=[
                {id:1, name:"Iphone 14 Pro Max", price:30000000},
                {id:2, name:"Samsung Galaxy S23 Ultra", price:25000000},
                {id:3, name:"Xiaomi Mi 13 Pro", price:20000000},
                {id:4, name:"Oppo Find X5 Pro", price:15000000}
            ]
        </script>
    </head>
    <body>
        <form id="product_form" style="margin-bottom:16px; padding:12px; border:1px solid #ccc; max-width:520px;">
            <fieldset style="border:none; padding:0; margin:0;">
                <legend style="font-weight:bold;">Product details</legend>
                <div style="margin-bottom:8px;"><label>ID: <input type="text" id="product_id" readonly style="width:120px;"></label></div>
                <div style="margin-bottom:8px;"><label>Name: <input type="text" id="product_name" readonly style="width:300px;"></label></div>
                <div><label>Price: <input type="text" id="product_price" readonly style="width:160px;"></label></div>
            </fieldset>
        </form>
        <table id="tbl_product"> 
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>#actions</th>
                </tr>
            </thead>
            <tbody id="product_table_body">
            </tbody>
        </table>
        <script src="js/mainjs.js"></script>
        <script>
            load_product_data(products,document.getElementById("product_table_body"));
        </script>
    </body>
</html>
