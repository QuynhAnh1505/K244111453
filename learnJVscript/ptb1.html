<html>
    <head>
        <title> Tiêu đề trang</title>
        <script>
            function solveEquation() 
            {
                //alert("Solving equation...");
                var a=eval(myForm.input_a.value);
                var b=eval(myForm.input_b.value);
                //alert("a = " + a + ", b = " + b);
                var result=""
                if (a == 0) 
                {
                    if (b == 0) {
                        result = "The equation has infinitely many solutions.";
                    } 
                    else {
                        result = "The equation has no solution.";
                    }
                } 
                else { 
                    result = -b/a;
                }
                myForm.input_result.value = result; 
                //td_result.innerText = result;
                td_result.innerHTML = "<font color='pink'>" + result + "</font>";
            }
        </script>
    </head>
    <body>
        <form name="myForm">
            <h1>First degree equation</h1>
            <table>
                <tr>
                    <td>a:</td>
                    <td><input type="text" id="input_a" name="input_a"></td>
                </tr>
                <tr>
                    <td>b:</td>
                    <td><input type="text" id="input_b" name="input_b" required></td>
                </tr>
                <tr>
                    <td>Result way 1:</td>
                    <td><input type="text" id="input_result" name="input_result" readonly></td>
                </tr>
                <tr>
                    <td>Result way 2:</td>
                    <td id="td_result"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="button" onclick="solveEquation()" value="Solve">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
