<html>
    <head>
        <title>Tiki Categories & Products</title>
        <script src="js/mainjs.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #f5f5f5;
            }
            h2 {
                color: #333;
                border-bottom: 3px solid #FF6B6B;
                padding-bottom: 10px;
            }
            table { 
                margin: 20px 0 40px 0; 
                border-collapse: collapse;
                background-color: white;
                width: 100%;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }
            th { 
                background-color: #FF6B6B;
                color: white;
                padding: 12px;
                text-align: left;
                font-weight: bold;
            }
            td { 
                border: 1px solid #ddd; 
                padding: 15px;
                text-align: left;
            }
            tr:hover {
                background-color: #f9f9f9;
            }
            img { 
                max-width: 120px; 
                height: auto;
                border-radius: 4px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            }
            #bodycategory td:first-child {
                width: 60%;
                font-weight: 500;
            }
            #bodycategory td:last-child {
                width: 40%;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>📁 Danh mục sản phẩm Tiki</h2>
        <table id="tblcustomers">
            <thead>
                <tr>
                    <th>Tên Danh mục</th>
                    <th>Hình ảnh Danh mục</th>
                </tr>
            </thead>
            <tbody id="bodycategory">
            </tbody>
        </table>
        <script>
            var dataset_path="datasets/categories.json";
            var bodycategory=document.getElementById("bodycategory");
            load_category_fromjson(dataset_path,bodycategory);

           
        </script>
    </body>
</html>
